<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Cluster</title>
<link rel="icon" href="./assets/cluster-diamond.svg" type="image/svg+xml">
<link rel="stylesheet" href="./src/home/style.css">
<style>
.reset-screen{min-height:100dvh;display:grid;place-items:center;
 padding:25px;background:var(--ui-background);color:var(--ui-text)}
.reset-screen-inner{width:min(100%,440px);display:grid;justify-items:center;
 gap:14px;text-align:center}
.reset-screen img{width:64px;height:64px}
.reset-screen h1{margin:0;font-size:28px}
.reset-screen p{font-size:13px;line-height:1.8;color:var(--ui-muted);
 overflow-wrap:anywhere}
.reset-screen button{padding:10px 18px;background:var(--ui-control);
 color:var(--ui-text);border:1px solid var(--ui-accent);border-radius:6px;
 cursor:pointer}
.reset-screen button[hidden]{display:none}
</style>
<script type="module" src="./src/home/reset.js"></script>
</head>
<body>
<main class="reset-screen"><div class="reset-screen-inner">
  <img src="./assets/cluster-diamond.svg" alt="">
  <h1>Cluster</h1>
  <p id="resetProgress" role="status" aria-live="polite"></p>
  <button id="resetRetry" type="button" hidden></button>
</div></main>
</body>
</html>
