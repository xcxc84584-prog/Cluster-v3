<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cluster-v3</title>
<link rel="icon" type="image/svg+xml" href="./assets/cluster-diamond.svg">
<script>
// Root path is the Cluster landing page. Preserve optional ?plugin=<id>.
const url = new URL("./plugin/", location.href);
const plugin = new URLSearchParams(location.search).get("plugin");
if (plugin) url.searchParams.set("plugin", plugin);
else url.searchParams.set("view", "home");
location.replace(url.href);
</script></head>
<body><a href="./plugin/">Cluster-v3 Plugin Manager</a></body></html>
