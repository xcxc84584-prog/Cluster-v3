<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello Cluster</title>
  <link rel="stylesheet" href="./styles/main.css">
  <script defer src="./scripts/cluster-client.js"></script>
  <script defer src="./scripts/app.js"></script>
</head>
<body>
  <main class="content">
    <header class="heading"><span class="mark">◇</span><div>
      <small>CLUSTER PLUGIN / EXAMPLE</small>
      <h1 id="heading">Hello Cluster</h1>
    </div></header>
    <p id="description">範例插件：透過 Router 和 PRMU 與 Cluster 溝通。</p>
    <div class="control-row">
      <button id="version" type="button">讀取系統版本</button>
      <button id="echo" type="button">呼叫 Echo API</button>
      <button id="record" type="button">寫入 LOG</button>
    </div>
    <pre id="output" aria-live="polite">Ready</pre>
    <footer id="footer">完全獨立的插件網頁，不接觸 Host DOM。</footer>
  </main>
</body>
</html>
